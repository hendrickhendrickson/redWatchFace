<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>redWatchFace preview</title>
		<!--
		  SYNC_TO_DEVICE resolves to Roboto on the Pixel Watch 4 - measured, see
		  docs/wff-findings.md's memory-footprint finding. Loading the same family here is
		  what makes the preview's glyphs, not just its layout, worth judging - without it
		  every host renders this in whatever "system-ui" happens to mean locally (Segoe UI
		  on Windows, San Francisco on macOS), neither of which is what ships. Best-effort:
		  offline, this silently falls back to system-ui, same as live.ts's weather fetch.
		-->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
		<link
			href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
